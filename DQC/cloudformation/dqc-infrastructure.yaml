AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DQC PoC — Core infrastructure (S3, DynamoDB, IAM; optionally ECS/ECR/ALB).
  Issue #6: S3 bucket for data/prompts/rules.
  Issue #10: DynamoDB for DQC store (PK: report_id=project, SK: report_sort=dqc_id).
  The ECS/ECR/ALB half (Issue #4) is opt-in via DeployEcs=true and is the only
  part that needs a VPC. This stack never creates networking.

Parameters:
  ProjectName:
    Type: String
    Default: dqc-poc
  AWSRegion:
    Type: String
    Default: eu-west-1
  DeployEcs:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Deploy the ECS/ECR/ALB half (Issue #4). Off by default: the Lambda stack
      needs only S3 + DynamoDB, and the ECS service cannot reach steady state
      until container images exist in ECR. Requires VpcId and SubnetIds.
  EcsDesiredCount:
    Type: Number
    Default: 0
    Description: >-
      Tasks to run. Left at 0 so the stack creates before any image has been
      pushed; scale up with `aws ecs update-service --desired-count 1` once the
      images are in ECR.
  VpcId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vpc-[0-9a-fA-F]{8}([0-9a-fA-F]{9})?$'
    Description: Existing VPC. Required only when DeployEcs is true.
  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Existing subnets, 2+ AZs. Required only when DeployEcs is true.
  BedrockModelId:
    Type: String
    Default: eu.amazon.nova-micro-v1:0
  TaskCpu:
    Type: Number
    Default: 1024
  MemoryMiB:
    Type: Number
    Default: 4096

Conditions:
  WithEcs: !Equals [!Ref DeployEcs, 'true']

Resources:
  # ── S3 Bucket (Issue #6) ──
  DqcDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-data-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  DqcDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DqcDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, ecs-tasks.amazonaws.com]
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !GetAtt DqcDataBucket.Arn
              - !Sub "${DqcDataBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ── DynamoDB Table (Issue #10) ──
  DqcStoreTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-dqc-store"
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: report_sort
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: dqc_status
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
        - AttributeName: report_sort
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification: { SSEEnabled: true }
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      GlobalSecondaryIndexes:
        - IndexName: DqcStatusIndex
          KeySchema:
            - AttributeName: dqc_status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection: { ProjectionType: ALL }

  # ── IAM: Lambda execution role ──
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-exec"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: LambdaDQCPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: !GetAtt DqcStoreTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt DqcDataBucket.Arn, !Sub "${DqcDataBucket.Arn}/*"]
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ── IAM: ECS execution role ──
  EcsExecRole:
    Type: AWS::IAM::Role
    Condition: WithEcs
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-exec"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWSRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - "arn:aws:bedrock:*::foundation-model/*"
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ── IAM: ECS task role ──
  EcsTaskRole:
    Type: AWS::IAM::Role
    Condition: WithEcs
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWSRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - "arn:aws:bedrock:*::foundation-model/*"
        - PolicyName: DQCAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt DqcStoreTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt DqcDataBucket.Arn, !Sub "${DqcDataBucket.Arn}/*"]
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ── ECS Cluster ──
  DqcEcsCluster:
    Type: AWS::ECS::Cluster
    Condition: WithEcs
    Properties:
      ClusterName: !Ref ProjectName

  # ── ECR Repositories ──
  DqcECRApi:
    Type: AWS::ECR::Repository
    Condition: WithEcs
    Properties:
      RepositoryName: !Sub "${ProjectName}-api"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }

  DqcECRDqc:
    Type: AWS::ECR::Repository
    Condition: WithEcs
    Properties:
      RepositoryName: !Sub "${ProjectName}-dqc"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }

  # ── Security Groups ──
  DqcAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      # VpcId/SubnetIds default to '' for the DeployEcs=false path,
      # where this resource is not created at all.
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Condition: WithEcs
    Properties:
      GroupDescription: Security group for DQC ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  DqcTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      # VpcId/SubnetIds default to '' for the DeployEcs=false path,
      # where this resource is not created at all.
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Condition: WithEcs
    Properties:
      GroupDescription: Security group for DQC ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref DqcAlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref DqcAlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  # ── CloudWatch Log Group ──
  DqcCloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WithEcs
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 14

  # ── Application Load Balancer ──
  DqcAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      # VpcId/SubnetIds default to '' for the DeployEcs=false path,
      # where this resource is not created at all.
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Condition: WithEcs
    Properties:
      Name: !Ref ProjectName
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref DqcAlbSecurityGroup]
      Subnets: !Ref SubnetIds

  DqcTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      # VpcId/SubnetIds default to '' for the DeployEcs=false path,
      # where this resource is not created at all.
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Condition: WithEcs
    Properties:
      TargetType: ip
      Name: !Sub "${ProjectName}-tg"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /

  DqcListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: WithEcs
    Properties:
      LoadBalancerArn: !Ref DqcAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DqcTargetGroup

  # ── ECS Task Definition ──
  DqcTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: WithEcs
    Properties:
      Family: !Ref ProjectName
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref TaskCpu
      Memory: !Ref MemoryMiB
      ExecutionRoleArn: !GetAtt EcsExecRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${ProjectName}-api:latest"
          Essential: true
          PortMappings: [{ ContainerPort: 8000 }]
          Environment:
            - Name: CORS_ORIGINS
              Value: '*'
            - Name: REGLLM_LLM
              Value: bedrock
            - Name: REGLLM_ROUTERS
              Value: dqc
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: BEDROCK_REGION
              Value: !Ref AWSRegion
            - Name: DYNAMODB_DQC_TABLE
              Value: !Ref DqcStoreTable
            - Name: S3_DQC_BUCKET
              Value: !Ref DqcDataBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DqcCloudWatchLogGroup
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: api
        - Name: dqc
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${ProjectName}-dqc:latest"
          Essential: true
          PortMappings: [{ ContainerPort: 80 }]
          Environment:
            - Name: API_UPSTREAM
              Value: localhost:8000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DqcCloudWatchLogGroup
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: dqc

  # ── ECS Service ──
  DqcService:
    Type: AWS::ECS::Service
    Metadata:
      # VpcId/SubnetIds default to '' for the DeployEcs=false path,
      # where this resource is not created at all.
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Condition: WithEcs
    DependsOn:
      - DqcListener
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref DqcEcsCluster
      TaskDefinition: !Ref DqcTaskDefinition
      DesiredCount: !Ref EcsDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref DqcTaskSecurityGroup]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - TargetGroupArn: !Ref DqcTargetGroup
          ContainerName: dqc
          ContainerPort: 80

  # ── CloudWatch Alarms ──
  DqcTaskErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WithEcs
    Properties:
      AlarmName: !Sub "${ProjectName}-task-errors"
      AlarmDescription: Alarm when ECS task has errors
      Namespace: AWS/ECS
      MetricName: Errors
      Dimensions:
        - Name: ClusterName
          Value: !Ref ProjectName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  DqcTaskLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WithEcs
    Properties:
      AlarmName: !Sub "${ProjectName}-task-latency"
      AlarmDescription: Alarm when ECS task latency exceeds 5s
      Namespace: AWS/ECS
      MetricName: AverageContainerLatency
      Dimensions:
        - Name: ClusterName
          Value: !Ref ProjectName
        - Name: TargetGroup
          Value: !Ref DqcTargetGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold

Outputs:
  S3BucketName:
    Value: !Ref DqcDataBucket
    Export: { Name: !Sub "${ProjectName}-S3BucketName" }

  DqcStoreTableName:
    Value: !Ref DqcStoreTable
    Export: { Name: !Sub "${ProjectName}-DqcStoreTableName" }

  DqcStoreTableArn:
    Value: !GetAtt DqcStoreTable.Arn
    Export: { Name: !Sub "${ProjectName}-DqcStoreTableArn" }

  DqcStoreStreamArn:
    Value: !GetAtt DqcStoreTable.StreamArn
    Export: { Name: !Sub "${ProjectName}-DqcStoreStreamArn" }

  S3BucketArn:
    Value: !GetAtt DqcDataBucket.Arn
    Export: { Name: !Sub "${ProjectName}-S3BucketArn" }

  DqcApiUri:
    Condition: WithEcs
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${ProjectName}-api"
    Export: { Name: !Sub "${ProjectName}-EcrApiUri" }

  DqcDqcUri:
    Condition: WithEcs
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${ProjectName}-dqc"
    Export: { Name: !Sub "${ProjectName}-EcrDqcUri" }

  EcsClusterName:
    Condition: WithEcs
    Value: !Ref DqcEcsCluster
    Export: { Name: !Sub "${ProjectName}-EcsClusterName" }

  EcsServiceName:
    Condition: WithEcs
    Value: !Ref DqcService
    Export: { Name: !Sub "${ProjectName}-EcsServiceName" }

  AlbDns:
    Condition: WithEcs
    Value: !GetAtt DqcAlb.DNSName
    Export: { Name: !Sub "${ProjectName}-AlbDns" }

  AlbUrl:
    Condition: WithEcs
    Value: !Sub "http://${DqcAlb.DNSName}"
    Export: { Name: !Sub "${ProjectName}-AlbHttps" }

  BedrockModelId:
    Value: !Ref BedrockModelId
    Export: { Name: !Sub "${ProjectName}-BedrockModelId" }