<section class="page">
  <p class="crumb">Page 2 of 4</p>
  <h1>Orders</h1>
  <p>Each button links to a different page.</p>

  <h2>Declarative link — routerLink on an &lt;a&gt; (preferred)</h2>
  <div class="grid">
    @for (l of links; track l.path) {
      <a class="btn" [routerLink]="l.path">{{ l.label }} &rarr;</a>
    }
  </div>

  <h2>Programmatic link — (click) + Router.navigate</h2>
  <button class="btn ghost" (click)="go('/reports')">Go to Reports (code)</button>

  <p class="hint">You are on <code>{{ router.url }}</code></p>
</section>
