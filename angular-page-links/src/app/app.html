<header class="topbar">
  <span class="brand">Page Links Demo</span>
  <nav>
    @for (p of pages; track p.path) {
      <a
        class="nav-link"
        [routerLink]="p.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: p.path === '/' }"
      >{{ p.label }}</a>
    }
  </nav>
</header>

<main class="shell">
  <!-- The active route's component is rendered here. -->
  <router-outlet />
</main>
