[pytest]
; scripts/ contains GPU/transformers-dependent smoke scripts that are not part
; of the CI suite — collecting them breaks on machines without those extras.
testpaths = tests

; The tests import `api`, `src` and `training` from the repository root.
; `python -m pytest` puts the working directory on sys.path and the `pytest`
; binary does not, so without this the suite passes one way and fails the
; other — which is exactly how it reached CI green locally and red there.
pythonpath = .
