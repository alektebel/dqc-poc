# Data Quality Assistant — local stack.
#
#   docker compose up --build                    the app (API + UI) on :8000
#   docker compose --profile ollama up --build   the app plus a local model
#   docker compose down                          stop
#   docker compose down -v                       also drop the cached models
#
# Open http://localhost:8000 — the API serves the four screens itself, so
# there is no second container and no proxy configuration.
#
# Configuration via .env (see .env.example):
#   REGLLM_LLM     LLM backend: auto | api | ollama | bedrock | stub
#   OLLAMA_MODEL   model pulled by the ollama profile (default: qwen3:4b)
#   APP_PORT       host port for the app (default: 8000)

name: dqc-poc

services:
  ollama:
    image: ollama/ollama:latest
    container_name: dqc-poc-ollama
    profiles: [ollama]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: dqc-poc-ollama-init
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL_TAG: "${OLLAMA_MODEL:-qwen3:4b}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ollama list 2>/dev/null | tail -n +2 | awk '{print $$1}' | grep -qx "$$MODEL_TAG"; then
          echo "[init] $$MODEL_TAG already present in Ollama cache"
        else
          echo "[init] pulling $$MODEL_TAG (this can take a while on first run)…"
          ollama pull "$$MODEL_TAG"
          echo "[init] $$MODEL_TAG ready"
        fi
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dqc-poc-app:latest
    container_name: dqc-poc-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # List form: a bare NAME passes the host value through ONLY if it is set.
      # Map form would set it to "" instead, and botocore rejects an empty
      # AWS_PROFILE with ProfileNotFound.
      - LOG_LEVEL=INFO
      - REGLLM_ROUTERS=dqc,revisions
      # Generation backend. REGLLM_LLM=stub runs the app with no model at
      # all (wiring works, generated controls are placeholders).
      - REGLLM_LLM=${REGLLM_LLM:-api}
      - REGLLM_API_URL=${REGLLM_API_URL:-https://api.nan.builders}
      - REGLLM_API_KEY=${NAN_API_KEY:-}
      - REGLLM_API_MODEL=${NAN_API_MODEL:-qwen3.6}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      # Must be an inference profile: the bare amazon.nova-micro-v1:0 is
      # rejected for on-demand throughput.
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-eu.amazon.nova-micro-v1:0}
      - BEDROCK_REGION=${BEDROCK_REGION:-eu-west-1}
      - REGLLM_LLM_TIMEOUT=${REGLLM_LLM_TIMEOUT:-120}
      # Credentials for REGLLM_LLM=bedrock. Either export these, or rely on
      # the read-only ~/.aws mount below.
      - AWS_PROFILE
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    volumes:
      # The revisions, their uploaded files and the generated controls.
      - ./data:/app/data
      # Read-only host credentials, so REGLLM_LLM=bedrock works without
      # copying keys into the environment. Harmless when ~/.aws is absent.
      - ${HOME}/.aws:/root/.aws:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:
