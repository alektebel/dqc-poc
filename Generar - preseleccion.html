  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"b07ea471-1843-4944-aa26-af9f19e770a4\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f1038b8d-da59-4e0b-aa71-cc4056d998ca\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fa3e5fae-d3da-4022-9361-73543a593017\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"68966c6d-ba69-4c7d-96c8-45ce64070cae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f1038b8d-da59-4e0b-aa71-cc4056d998ca\ isplay: swap;\n  src: url(\"68966c6d-ba69-4c7d-96c8-45ce64070cae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f1038b8d-da59-4e0b-aa71-cc4056d998ca\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fa3e5fae-d3da-4022-9361-73543a593017\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"68966c6d-ba69-4c7d-96c8-45ce64070cae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #e9e9e9; font-family: \"Archivo\", system-ui, sans-serif; color: #2d2d2d; }\n  * { box-sizing: border-box; }\n  a { color: #d04a02; text-decoration: none; }\n  a:hover { color: #a63c02; text-decoration: underline; }\n  button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #d04a02; outline-offset: 2px; }\n  ::selection { background: #ffb600; color: #000; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"padding: 48px 48px 80px; font-size: 17px;\">\n  <div style=\"max-width: 900px; margin-bottom: 40px;\">\n    <div style=\"font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #d04a02;\">Preselección · Pantalla «Generar controles»<\u002Fdiv>\n    <h1 style=\"margin: 10px 0 12px; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;\">Las tres que siguen en pie<\u002Fh1>\n    <p style=\"margin: 0; font-size: 19px; color: #444444; text-wrap: pretty;\">Las tres reconocen los campos en vivo contra el diccionario: escribe o edita cualquier regla y la respuesta cambia al teclear. <a href=\"#1b\">1b<\u002Fa> una regla por fila, <a href=\"#1d\">1d<\u002Fa> texto libre comprendido línea a línea, <a href=\"#2b\">2b<\u002Fa> reglas extraídas del funcional con su cita.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;\">\n\n    <!-- ══ 1b · Cola de reglas ══ -->\n    <div id=\"1b\" style=\"flex: 0 0 900px; width: 900px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n        <span style=\"font-size: 15px; font-weight: 800; background: #000000; color: #ffffff; padding: 4px 10px;\">1b<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;\">Cola de reglas, una por fila<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 20px; font-size: 17px; color: #545454; max-width: 72ch; text-wrap: pretty;\">Se sigue escribiendo, pero de una en una: al añadir una regla se convierte en fila y la app contesta con los campos que ha encontrado. Una regla ambigua se ve antes de generar, no después.<\u002Fp>\n\n      <div style=\"background: #ffffff; border: 2px solid #000000;\">\n        <div style=\"height: 6px; background: #d04a02;\"><\u002Fdiv>\n        <div style=\"padding: 32px;\">\n          <h3 style=\"margin: 0 0 8px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;\">Generar controles<\u002Fh3>\n          <p style=\"margin: 0 0 24px; font-size: 18px; color: #545454; max-width: 60ch; text-wrap: pretty;\">Añade una regla y la app te dirá al momento qué campos del diccionario ha reconocido.<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px;\">\n            <input type=\"text\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" placeholder=\"p. ej. El código de gestor debe existir en el maestro\" style=\"font: inherit; font-size: 18px; padding: 16px; border: 2px solid #000000; background: #ffffff; color: #2d2d2d;\">\n            <button sc-camel-on-click=\"{{ addRule }}\" style=\"font: inherit; font-size: 18px; font-weight: 600; padding: 16px 28px; background: #ffffff; color: #2d2d2d; border: 2px solid #000000; cursor: pointer; white-space: nowrap;\" style-hover=\"background: #f2f2f2;\">Añadir regla<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin: 10px 0 28px; font-size: 16px; color: {{ draftColor }}; min-height: 24px; text-wrap: pretty;\">{{ draftEcho }}<\u002Fp>\n\n          <div style=\"border-top: 2px solid #000000;\">\n            <sc-for list=\"{{ queue }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 18px 8px; border-bottom: 2px solid #e6e6e6;\">\n                <span style=\"width: 34px; height: 34px; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; background: {{ q.markBg }}; color: {{ q.markFg }};\">{{ q.mark }}<\u002Fspan>\n                <span style=\"min-width: 0;\">\n                  <input type=\"text\" value=\"{{ q.text }}\" sc-camel-on-change=\"{{ q.edit }}\" style=\"font: inherit; width: 100%; font-size: 18px; font-weight: 600; padding: 6px 8px; margin-left: -8px; border: 2px solid transparent; background: transparent; color: #2d2d2d;\" style-hover=\"border-color: #e6e6e6;\" style-focus=\"border-color: #000000; background: #ffffff;\">\n                  <span style=\"display: block; font-size: 16px; color: {{ q.echoColor }}; margin-top: 4px; text-wrap: pretty;\">{{ q.echo }}<\u002Fspan>\n                <\u002Fspan>\n                <button sc-camel-on-click=\"{{ q.remove }}\" style=\"font: inherit; font-size: 15px; color: #7d7d7d; background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline;\" style-hover=\"color: #e0301e;\">Quitar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ noop }}\" style=\"font: inherit; margin-top: 28px; font-size: 19px; font-weight: 600; padding: 18px 32px; background: #d04a02; color: #ffffff; border: 0; cursor: pointer; text-align: left;\" style-hover=\"background: #a63c02;\">{{ queueCta }}<\u002Fbutton>\n          <p style=\"margin: 12px 0 0; font-size: 16px; color: #545454;\">{{ queueNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ══ 1d · Texto libre comprendido en vivo ══ -->\n    <div id=\"1d\" style=\"flex: 0 0 900px; width: 900px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n        <span style=\"font-size: 15px; font-weight: 800; background: #000000; color: #ffffff; padding: 4px 10px;\">1d<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;\">Texto libre, comprendido en vivo<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 20px; font-size: 17px; color: #545454; max-width: 72ch; text-wrap: pretty;\">El cambio mínimo sobre lo que ya hay: se mantiene el cuadro de texto — cómodo para pegar una lista de un correo o un funcional — pero cada línea se contesta al teclear con los campos reconocidos, y el botón dice cuántos controles saldrán. Prueba a escribir una línea nueva: la columna derecha responde sin esperar.<\u002Fp>\n\n      <div style=\"background: #ffffff; border: 2px solid #000000;\">\n        <div style=\"height: 6px; background: #d04a02;\"><\u002Fdiv>\n        <div style=\"padding: 32px;\">\n          <h3 style=\"margin: 0 0 8px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;\">Generar controles<\u002Fh3>\n          <p style=\"margin: 0 0 24px; font-size: 18px; color: #545454; max-width: 60ch; text-wrap: pretty;\">Pega o escribe las reglas, una por línea. A la derecha verás qué ha entendido la app de cada una.<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 2px solid #000000;\">\n            <textarea rows=\"10\" value=\"{{ freeText }}\" sc-camel-on-change=\"{{ setFreeText }}\" style=\"font-family: ui-monospace, monospace; font-size: 17px; line-height: 1.9; padding: 16px; border: 0; border-right: 2px solid #000000; background: #ffffff; color: #2d2d2d; resize: vertical;\"><\u002Ftextarea>\n            <div style=\"padding: 16px; background: #f7f7f7;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;\">\n                <span style=\"font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #545454;\">Lo que ha entendido<\u002Fspan>\n                <span style=\"font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #d04a02;\">en vivo<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ freeLines }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <div style=\"display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 2px solid #e6e6e6;\">\n                  <span style=\"font-size: 16px; font-weight: 800; color: {{ l.color }}; text-align: center;\">{{ l.mark }}<\u002Fspan>\n                  <span style=\"min-width: 0;\">\n                    <span style=\"display: block; font-size: 15px; color: #545454; text-wrap: pretty;\">{{ l.source }}<\u002Fspan>\n                    <span style=\"display: block; font-size: 16px; color: {{ l.color }}; margin-top: 2px; text-wrap: pretty;\">{{ l.echo }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ freeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 8px 0; border-top: 2px solid #e6e6e6; font-size: 16px; color: #7d7d7d; text-wrap: pretty;\">Escribe una regla a la izquierda y aparecerá aquí lo que la app reconoce.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ noop }}\" style=\"font: inherit; margin-top: 28px; font-size: 19px; font-weight: 600; padding: 18px 32px; background: {{ freeBg }}; color: {{ freeFg }}; border: {{ freeBorder }}; cursor: pointer; text-align: left;\">{{ freeCta }}<\u002Fbutton>\n          <p style=\"margin: 12px 0 0; font-size: 16px; color: #545454;\">{{ freeNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ══ 2b · Extracción del funcional ══ -->\n    <div id=\"2b\" style=\"flex: 0 0 900px; width: 900px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n        <span style=\"font-size: 15px; font-weight: 800; background: #000000; color: #ffffff; padding: 4px 10px;\">2b<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;\">Extraídas del funcional, con su cita<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 20px; font-size: 17px; color: #545454; max-width: 72ch; text-wrap: pretty;\">Las reglas ya están escritas: están en el funcional y en el programa SAS. La app las localiza y las propone citando el párrafo o las líneas de origen. El usuario acepta, matiza el texto — los campos reconocidos se recalculan al teclear — o descarta; nada se genera sin fuente.<\u002Fp>\n\n      <div style=\"background: #ffffff; border: 2px solid #000000;\">\n        <div style=\"height: 6px; background: #d04a02;\"><\u002Fdiv>\n        <div style=\"padding: 32px;\">\n          <h3 style=\"margin: 0 0 8px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;\">Generar controles<\u002Fh3>\n          <p style=\"margin: 0 0 24px; font-size: 18px; color: #545454; max-width: 62ch; text-wrap: pretty;\">Leídos <span style=\"font-family: ui-monospace, monospace;\">funcional_ciclos.docx<\u002Fspan> y <span style=\"font-family: ui-monospace, monospace;\">ciclos_recuperacion.sas<\u002Fspan>. {{ extrCount }} reglas candidatas.<\u002Fp>\n\n          <div style=\"border-top: 2px solid #000000;\">\n            <sc-for list=\"{{ extracted }}\" as=\"x\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 24px; align-items: start; padding: 20px 8px; border-bottom: 2px solid #e6e6e6; background: {{ x.rowBg }};\">\n                <span style=\"min-width: 0;\">\n                  <span style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n                    <span style=\"font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 8px; background: {{ x.confBg }}; color: {{ x.confFg }};\">{{ x.conf }}<\u002Fspan>\n                    <span style=\"font-size: 14px; color: {{ x.echoColor }}; text-wrap: pretty;\">{{ x.echo }}<\u002Fspan>\n                  <\u002Fspan>\n                  <input type=\"text\" value=\"{{ x.text }}\" sc-camel-on-change=\"{{ x.edit }}\" style=\"font: inherit; width: 100%; font-size: 18px; font-weight: 600; padding: 6px 8px; margin: 8px 0 0 -8px; border: 2px solid transparent; background: transparent; color: #2d2d2d;\" style-hover=\"border-color: #e6e6e6;\" style-focus=\"border-color: #000000; background: #ffffff;\">\n                  <span style=\"display: block; margin-top: 8px; padding-left: 14px; border-left: 4px solid #d9d9d9; font-size: 16px; color: #545454; text-wrap: pretty;\">{{ x.quote }}<\u002Fspan>\n                  <span style=\"display: block; margin-top: 6px; padding-left: 14px; font-size: 14px; font-family: ui-monospace, monospace; color: #7d7d7d;\">{{ x.src }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <button sc-camel-on-click=\"{{ x.accept }}\" style=\"font: inherit; font-size: 16px; font-weight: 600; padding: 12px 18px; background: {{ x.okBg }}; color: {{ x.okFg }}; border: 2px solid #000000; cursor: pointer; text-align: left;\" style-hover=\"background: #a63c02; color: #ffffff;\">{{ x.okLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ x.discard }}\" style=\"font: inherit; font-size: 16px; padding: 12px 18px; background: {{ x.outBg }}; color: {{ x.outFg }}; border: 2px solid #bfbfbf; cursor: pointer; text-align: left;\" style-hover=\"border-color: #e0301e; color: #b0250f;\">{{ x.outLabel }}<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 20px; align-items: center; margin-top: 28px; flex-wrap: wrap;\">\n            <button sc-camel-on-click=\"{{ noop }}\" style=\"font: inherit; font-size: 19px; font-weight: 600; padding: 16px 30px; background: {{ extrBg }}; color: {{ extrFg }}; border: {{ extrBorder }}; cursor: pointer; text-align: left;\">{{ extrCta }}<\u002Fbutton>\n            <span style=\"font-size: 16px; color: #545454;\">{{ extrNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst QUEUE = [\n  { id: 'q1', text: 'La fecha de fin del ciclo no puede ser anterior a la de inicio' },\n  { id: 'q2', text: 'El importe pendiente no puede ser negativo' },\n  { id: 'q3', text: 'El saldo tiene que cuadrar con el cierre' }\n];\n\nconst FREE_TEXT = 'La fecha de fin del ciclo no puede ser anterior a la fecha de inicio\\nEl importe pendiente no puede ser negativo\\nEl código de gestor debe existir en el maestro de gestores\\nEl saldo tiene que cuadrar con el cierre';\n\nconst EXTRACTED = [\n  { id: 'E1', text: 'La fecha de fin del ciclo no puede ser anterior a la de inicio', quote: '«El cierre de un ciclo de recuperación se registra siempre en fecha igual o posterior a su apertura.»', src: 'funcional_ciclos.docx · §4.2, párrafo 3', conf: 'Fuente explícita', status: 'ok' },\n  { id: 'E2', text: 'Un solo ciclo abierto o en gestión por contrato', quote: 'if est_ciclo in (\\'ABIERTO\\',\\'GESTION\\') then n_abiertos + 1; if n_abiertos > 1 then put \"ERR\";', src: 'ciclos_recuperacion.sas · líneas 210-244', conf: 'Fuente explícita', status: 'ok' },\n  { id: 'E3', text: 'El importe pendiente no puede ser negativo', quote: '«El pendiente refleja el saldo vivo del ciclo; los abonos se imputan reduciendo dicho saldo hasta cero.»', src: 'funcional_ciclos.docx · §5.1, párrafo 1', conf: 'Inferida', status: 'pending' },\n  { id: 'E4', text: 'La fecha de alta no puede superar la fecha de proceso', quote: '«Ninguna alta se registra con posterioridad al cierre contable del periodo.»', src: 'funcional_ciclos.docx · §3.4, nota al pie', conf: 'Inferida', status: 'pending' }\n];\n\n/** the dictionary, as far as the live matcher is concerned */\nconst FIELD_HINTS = [\n  { re: /(fecha de fin|fec_fin|cierre del ciclo|fin del ciclo)/i, fields: ['FEC_FIN_CICLO'] },\n  { re: /(de inicio|\\binicio\\b|fec_ini|apertura|inicial)/i, fields: ['FEC_INI_CICLO'] },\n  { re: /(fecha de alta|fec_alta|alta)/i, fields: ['FEC_ALTA'] },\n  { re: /(importe|imp_pendiente|pendiente|cuant)/i, fields: ['IMP_PENDIENTE'] },\n  { re: /(gestor|maestro)/i, fields: ['COD_GESTOR → maestro_gestores'] },\n  { re: /(estado|catálogo|catalogo|abierto|gestión|gestion)/i, fields: ['EST_CICLO'] },\n  { re: /(ciclo abierto|número de ciclo|numero de ciclo|unicidad|num_ciclo)/i, fields: ['NUM_CICLO'] },\n  { re: /(contrato)/i, fields: ['CONTRATO'] }\n];\nconst AMBIGUOUS = [\n  { re: /(saldo)/i, echo: 'Dos campos posibles para «saldo»: SLD_CIERRE e IMP_CIERRE. Precisa cuál antes de generar.' }\n];\n\nclass Component extends DCLogic {\n  /** live keyword match against the dictionary — never invents a field */\n  match(text) {\n    const t = (text || '').trim();\n    if (!t) return { ok: false, echo: 'Línea vacía.' };\n    const amb = AMBIGUOUS.find((a) => a.re.test(t));\n    if (amb) return { ok: false, echo: amb.echo };\n    const found = [];\n    FIELD_HINTS.forEach((h) => {\n      if (h.re.test(t)) h.fields.forEach((f) => { if (!found.includes(f)) found.push(f); });\n    });\n    if (!found.length) {\n      return { ok: false, echo: 'Sin campo claro en el diccionario: precisa el nombre del campo o elígelo en la lista.' };\n    }\n    return { ok: true, echo: (found.length > 1 ? 'Campos reconocidos: ' : 'Campo reconocido: ') + found.join(', ') };\n  }\n\n  state = {\n    queue: QUEUE.map((q) => ({ ...q })),\n    draft: '',\n    freeText: FREE_TEXT,\n    extracted: EXTRACTED.map((e) => ({ ...e }))\n  };\n\n  renderVals() {\n    const s = this.state;\n    const draftM = s.draft.trim() ? this.match(s.draft) : null;\n    const queueRows = s.queue.map((q) => ({ q: q, m: this.match(q.text) }));\n    const queueOk = queueRows.filter((r) => r.m.ok).length;\n    const lines = s.freeText.split('\\n').map((l) => l.trim()).filter(Boolean);\n    const lineM = lines.map((l) => this.match(l));\n    const freeOk = lineM.filter((m) => m.ok).length;\n    const extrOk = s.extracted.filter((x) => x.status === 'ok').length;\n    const extrOut = s.extracted.filter((x) => x.status === 'out').length;\n    const extrPend = s.extracted.length - extrOk - extrOut;\n\n    return {\n      noop: () => {},\n\n      draft: s.draft,\n      setDraft: (e) => this.setState({ draft: e.target.value }),\n      draftEcho: draftM ? draftM.echo : 'Los campos reconocidos aparecen aquí mientras escribes.',\n      draftColor: draftM ? (draftM.ok ? '#545454' : '#8a5c00') : '#545454',\n      addRule: () => {\n        const t = s.draft.trim();\n        if (!t) return;\n        this.setState((st) => ({ draft: '', queue: st.queue.concat([{ id: 'q' + Date.now(), text: t }]) }));\n      },\n      queue: queueRows.map((r) => ({\n        text: r.q.text, echo: r.m.echo,\n        mark: r.m.ok ? '✓' : '!',\n        markBg: r.m.ok ? '#000000' : '#ffb600',\n        markFg: r.m.ok ? '#ffffff' : '#000000',\n        echoColor: r.m.ok ? '#545454' : '#8a5c00',\n        edit: (e) => {\n          const v = e.target.value;\n          this.setState((st) => ({ queue: st.queue.map((x) => (x.id === r.q.id ? { ...x, text: v } : x)) }));\n        },\n        remove: () => this.setState((st) => ({ queue: st.queue.filter((x) => x.id !== r.q.id) }))\n      })),\n      queueCta: queueOk\n        ? 'Generar ' + queueOk + (queueOk === 1 ? ' control' : ' controles')\n        : 'Ninguna regla resuelta todavía',\n      queueNote: (s.queue.length - queueOk) > 0\n        ? (s.queue.length - queueOk) + ((s.queue.length - queueOk) === 1 ? ' regla sin resolver: se queda' : ' reglas sin resolver: se quedan') + ' fuera hasta que precises el campo.'\n        : 'Todas las reglas tienen campos reconocidos.',\n\n      freeText: s.freeText,\n      setFreeText: (e) => this.setState({ freeText: e.target.value }),\n      freeEmpty: lines.length === 0,\n      freeLines: lines.map((l, i) => ({\n        source: l.length > 58 ? l.slice(0, 58) + '…' : l,\n        echo: lineM[i].echo,\n        mark: lineM[i].ok ? '✓' : '!',\n        color: lineM[i].ok ? '#2d2d2d' : '#8a5c00'\n      })),\n      freeBg: freeOk ? '#d04a02' : '#e6e6e6',\n      freeFg: freeOk ? '#ffffff' : '#545454',\n      freeBorder: freeOk ? '2px solid #d04a02' : '2px solid #bfbfbf',\n      freeCta: freeOk\n        ? 'Generar ' + freeOk + (freeOk === 1 ? ' control' : ' controles')\n        : 'Ninguna línea entendida todavía',\n      freeNote: (lines.length - freeOk) > 0\n        ? (lines.length - freeOk) + ((lines.length - freeOk) === 1 ? ' línea sin campo claro: no se generará.' : ' líneas sin campo claro: no se generarán.')\n        : (lines.length === 1 ? 'La línea se ha entendido.' : 'Las ' + lines.length + ' líneas se han entendido.'),\n\n      extrCount: s.extracted.length,\n      extracted: s.extracted.map((x) => {\n        const m = this.match(x.text);\n        return {\n          text: x.text, quote: x.quote, src: x.src, conf: x.conf,\n          echo: m.echo,\n          echoColor: m.ok ? '#545454' : '#8a5c00',\n          confBg: x.conf === 'Fuente explícita' ? '#000000' : '#ffb600',\n          confFg: x.conf === 'Fuente explícita' ? '#ffffff' : '#000000',\n          rowBg: x.status === 'ok' ? '#fdf1eb' : (x.status === 'out' ? '#f7f7f7' : '#ffffff'),\n          okLabel: x.status === 'ok' ? '✓ Aceptada' : 'Aceptar',\n          okBg: x.status === 'ok' ? '#d04a02' : '#ffffff',\n          okFg: x.status === 'ok' ? '#ffffff' : '#2d2d2d',\n          outLabel: x.status === 'out' ? '✗ Descartada' : 'Descartar',\n          outBg: x.status === 'out' ? '#e6e6e6' : '#ffffff',\n          outFg: x.status === 'out' ? '#545454' : '#7d7d7d',\n          edit: (e) => {\n            const v = e.target.value;\n            this.setState((st) => ({ extracted: st.extracted.map((y) => (y.id === x.id ? { ...y, text: v } : y)) }));\n          },\n          accept: () => this.setState((st) => ({ extracted: st.extracted.map((y) => (y.id === x.id ? { ...y, status: 'ok' } : y)) })),\n          discard: () => this.setState((st) => ({ extracted: st.extracted.map((y) => (y.id === x.id ? { ...y, status: 'out' } : y)) }))\n        };\n      }),\n      extrBg: extrOk ? '#d04a02' : '#e6e6e6',\n      extrFg: extrOk ? '#ffffff' : '#545454',\n      extrBorder: extrOk ? '2px solid #d04a02' : '2px solid #bfbfbf',\n      extrCta: extrOk\n        ? 'Generar ' + extrOk + (extrOk === 1 ? ' control con fuente' : ' controles con fuente')\n        : 'Acepta al menos una regla',\n      extrNote: extrPend > 0\n        ? extrPend + (extrPend === 1 ? ' pendiente de decisión · ' : ' pendientes de decisión · ') + extrOut + (extrOut === 1 ? ' descartada' : ' descartadas')\n        : extrOut + (extrOut === 1 ? ' regla descartada' : ' reglas descartadas') + ' · nada pendiente'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
